apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: omniflow-infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: omniflow-prometheus
rules:
  - apiGroups: [ "" ]
    resources: [ "pods", "nodes", "endpoints", "services" ]
    verbs: [ "get", "list", "watch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: omniflow-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omniflow-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: omniflow-infra
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: omniflow-infra
data:
  prometheus.yml: |
    global:
      scrape_interval: 1s
      evaluation_interval: 1s

    scrape_configs:
      - job_name: "omniflow-daemon"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [ __meta_kubernetes_pod_label_app ]
            regex: omniflow-daemon
            action: keep
          - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_port ]
            target_label: __address__
            regex: (.+)
            replacement: ${1}
            action: replace
          - source_labels: [ __meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port ]
            separator: ":"
            target_label: __address__
          - source_labels: [ __meta_kubernetes_pod_name ]
            target_label: daemon_pod
          - source_labels: [ __meta_kubernetes_pod_node_name ]
            target_label: node
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: omniflow-infra
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=1h"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: web
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: { }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: omniflow-infra
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: web
