apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-script
  namespace: ${OMNIFLOW_NAMESPACE}
data:
  server.py: |
    #!/usr/bin/env python3
    """Minimal HTTP server that burns CPU on every request.

    Each GET / computes a sum-of-squares over BURN_ITERS iterations so
    that the pod consumes measurable CPU even under a tight limit.
    Tune BURN_ITERS via env var if you need more or less heat.
    """
    import http.server
    import os
    import socketserver

    BURN_ITERS = int(os.environ.get("BURN_ITERS", "8000"))
    PORT = int(os.environ.get("PORT", "80"))
    
    
    def _burn():
        return sum(i * i for i in range(BURN_ITERS))
    
    
    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/health":
                body = b"healthy\n"
            else:
                _burn()
                body = b"ok\n"
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):  # suppress access log noise
            pass
    
    
    with socketserver.ThreadingTCPServer(("0.0.0.0", PORT), Handler) as httpd:
        httpd.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: ${OMNIFLOW_NAMESPACE}
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: python:3.12-slim
          command: [ "python3", "/app/server.py" ]
          ports:
            - containerPort: 80
          env:
            - name: BURN_ITERS
              value: "8000"
            - name: PORT
              value: "80"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m   # tight cap - 8k iterations saturates this under load
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: script
          configMap:
            name: workload-script
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: ${OMNIFLOW_NAMESPACE}
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
