apiVersion: v1
kind: ServiceAccount
metadata:
  name: omniflow-daemon
  namespace: omniflow-infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: omniflow-daemon
rules:
  - apiGroups: [ "" ]
    resources: [ "pods" ]
    verbs: [ "get", "list" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: omniflow-daemon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omniflow-daemon
subjects:
  - kind: ServiceAccount
    name: omniflow-daemon
    namespace: omniflow-infra
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: omniflow-daemon
  namespace: omniflow-infra
  labels:
    app: omniflow-daemon
spec:
  selector:
    matchLabels:
      app: omniflow-daemon
  template:
    metadata:
      labels:
        app: omniflow-daemon
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      serviceAccountName: omniflow-daemon
      containers:
        - name: daemon
          image: omniflow-daemon:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9100
              name: metrics
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: BASE_INTERVAL
              value: "1.0"
            - name: REFRESH_INTERVAL
              value: "5.0"
            - name: DAEMON_PORT
              value: "9100"
            - name: OMNIFLOW_CONTROL_PORT
              value: "9101"
            - name: OMNIFLOW_MIN_INTERVAL
              value: "15"
            - name: OMNIFLOW_MAX_INTERVAL
              value: "30"
            - name: OMNIFLOW_CPU_TRACKER_OFFSET
              value: "0.2"
            - name: OMNIFLOW_TRACE_PATH
              value: "/var/run/omniflow/trace.jsonl"
            - name: OMNIFLOW_TRACE_STARTUP_PATH
              value: "/var/run/omniflow/startup.jsonl"
            - name: OMNIFLOW_TRACE_NAMESPACE_PREFIX
              value: "omniflow-hpa-"
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: trace
              mountPath: /var/run/omniflow
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: trace
          emptyDir:
            sizeLimit: 1Gi
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
      tolerations:
        - operator: Exists
